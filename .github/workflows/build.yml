name: Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          test-java-version: 25
          arch: x64
          runner: windows-latest
          expander_leg: windows-latest-25-x64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - id: setup-java-test
      name: Set up Java ${{ matrix.test-java-version }} for tests
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6   # v6.0.1
      with:
          # using zulu for 26 because new releases get published quickly
        distribution: zulu
        java-version: ${{ matrix.test-java-version }}

    - id: setup-java
      name: Set up Java for build
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6   # v6.0.1
      with:
        distribution: temurin
        java-version: 26.0.2+10

    - name: Set up gradle
        # zizmor: ignore[cache-poisoning] This tests release branches but does not
        # publish release artifacts.
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb   # v6.3.0
      with:
          # Keep one writer per OS because Gradle User Home caches are platform-specific.
        cache-read-only: ${{ github.ref_name != 
          github.event.repository.default_branch || matrix.test-java-version != 
          25 }}
        gradle-home-cache-excludes: >-
          ${{ secrets.DEVELOCITY_ACCESS_KEY != '' && github.ref_name == github.event.repository.default_branch
          && matrix.test-java-version == 25 && 'caches/build-cache-1' || '' }}
    - name: Build
      shell: bash
      run: >
        ./gradlew build
        ${{ matrix.coverage && 'jacocoTestReport' || '' }}
        -PtestJavaVersion=${{ matrix.test-java-version }}
        "-Porg.gradle.java.installations.paths=${TEST_JAVA_PATH}"
        "-Porg.gradle.java.installations.auto-download=false"
      env:
        TEST_JAVA_PATH: ${{ steps.setup-java-test.outputs.path }}
          # JMH-based tests run only if this environment variable is set to true
        RUN_JMH_BASED_TESTS: ${{ matrix.jmh-based-tests }}
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

    - name: Check for diff
        # The jApiCmp diff compares current to latest, which isn't appropriate for release branches
        # this fails on windows because of the bash-specific if/then/else syntax, but that's ok
        # because we only need to run this validation once (on any platform)
      if: ${{ matrix.os != 'windows-latest' && !startsWith(github.ref_name, 
        'release/') && !startsWith(github.base_ref, 'release/') }}
      run: |
        # need to "git add" in case any generated files did not already exist
        git add docs/apidiffs
        if git diff --cached --quiet
        then 
          echo "No diff detected."
        else 
          echo "Diff detected - did you run './gradlew jApiCmp'?"
          echo $(git diff --cached --name-only)
          echo $(git diff --cached)
          exit 1
        fi

    - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4   # v7.1.0
      if: ${{ matrix.coverage }}
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      if: ${{ matrix.coverage }}
      with:
        name: coverage-report
        path: all/build/reports/jacoco/test/html

    timeout-minutes: 150
